<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>觸感測試</title>
<style>
body{font:18px/1.6 -apple-system,sans-serif;background:#F6D3DC;color:#4a2420;margin:0;padding:24px 20px}
h1{font-size:22px;margin:0 0 8px}.box{background:#fff;border-radius:16px;padding:16px;margin:16px 0}
.box b{display:block;margin-bottom:10px}
.big{position:relative;height:90px;border-radius:45px;background:#D7353A;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.big input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:.011}
.mid input{transform:scale(2.5);margin:20px 40px}
</style></head><body>
<h1>iPhone 觸感測試</h1>
<p>每個都點一下，記下哪幾個有「喀」的觸感。</p>
<div class="box"><b>A. 一般大小的開關（看得到）</b><input type="checkbox" switch></div>
<div class="box mid"><b>B. 放大的開關（看得到）</b><input type="checkbox" switch></div>
<div class="box"><b>C. 透明開關蓋在按鈕上（遊戲現在的做法）</b><div class="big">點我<input type="checkbox" switch></div></div>
<div class="box"><b>D. 點文字標籤切換開關</b><label style="display:flex;align-items:center;gap:12px;padding:12px;background:#FBE7A6;border-radius:12px"><input type="checkbox" switch>點這行字（不要點開關本身）</label></div>
</body></html>
